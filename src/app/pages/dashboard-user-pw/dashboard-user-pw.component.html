<!-- src/app/pages/dashboard-user-pw/dashboard-user-pw.component.html -->

<div class="user-dashboard-container">
  <h1>Gestión de documentación del becario</h1>

  <div class="documents-grid">
    <!-- Columna Izquierda: Carrusel de Carga de Documentos -->
    <section class="document-upload-panels">
      <h2>Documentos requeridos</h2>
      <div class="carousel-wrapper">
        <button class="carousel-nav-btn prev-btn" (click)="prevDocument()">
          <i class="fas fa-chevron-left"></i>
        </button>

        <div class="document-carousel-inner">
          <div class="carousel-item"
               *ngFor="let docType of documentTypes; let i = index"
               [ngClass]="{ 'active': isActive(i) }">
            
            <app-document-upload-card-pw
              [documentName]="docType"
              [isRequired]="true"
              (fileSelected)="onFileChange($event)"
              (previewRequested)="onPreviewRequest($event)"
              (fileRemoved)="onFileRemoved($event)">
            </app-document-upload-card-pw>
            
          </div>
        </div>

        <button class="carousel-nav-btn next-btn" (click)="nextDocument()">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </section>

    <!-- Columna Derecha: Previsualizador de PDF -->
    <section class="pdf-viewer-section">
      <h2>Vista previa</h2>
      <div class="pdf-viewer-container">
        <ng-container *ngIf="currentPreviewUrl; else noPreviewTemplate">
          <iframe [src]="currentPreviewUrl" class="pdf-iframe" frameborder="0"></iframe>
        </ng-container>
        <ng-template #noPreviewTemplate>
          <div class="no-preview-placeholder">
            <i class="fas fa-file-pdf"></i>
            <p>Selecciona un documento para previsualizarlo aquí.</p>
          </div>
        </ng-template>
      </div>
      <p class="preview-file-name">{{ currentPreviewFileName || 'Ningún documento seleccionado' }}</p>
      
      <!-- ¡CORRECCIÓN CLAVE AQUÍ! Se añade el evento (click) para llamar a saveExpedient() -->
      <button class="btn-save-all" [disabled]="!canSaveExpedient()" (click)="saveExpedient()">
        <i class="fas fa-save"></i> Guardar cambios
      </button>
    </section>
  </div>
</div>
