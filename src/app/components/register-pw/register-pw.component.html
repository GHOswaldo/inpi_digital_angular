<div class="register-left-panel">
  <div class="register-card-content">
    <h2>Registrarse</h2>

    <form (ngSubmit)="onSubmit()">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" [(ngModel)]="password" required>

      <label for="confirmPassword">Confirmar contraseña:</label>
      <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required>

      <button type="submit">Registrar</button>
      <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
    </form>

    <p class="login-link">¿Ya tienes cuenta? <a [routerLink]="['/login-pw']">Iniciar sesión</a></p>
  </div>
</div>
