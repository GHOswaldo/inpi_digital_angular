<!-- src/app/shared/document-upload-card-pw/document-upload-card-pw.component.html -->

<div class="document-card"
     [ngClass]="{
       'drag-over': isDragOver,
       'uploaded': fileStatus === 'uploaded',
       'selected': fileStatus === 'selected',
       'error': fileStatus === 'error'
     }">

  <div class="card-header">
    <div class="document-title-group">
      <span class="document-name">{{ documentName }}</span>
      <!-- ELIMINADO: <span *ngIf="isRequired" class="required-tag-line">(Obligatorio)</span> -->
    </div>
    <span class="document-status" [ngClass]="fileStatus">
      {{
        fileStatus === 'pending' ? 'Pendiente' :
        fileStatus === 'selected' ? 'Seleccionado' :
        fileStatus === 'uploaded' ? 'Cargado' :
        fileStatus === 'error' ? 'Error' : ''
      }}
      <i class="status-icon" [ngClass]="{
        'fas fa-hourglass-half': fileStatus === 'pending',
        'fas fa-file-upload': fileStatus === 'selected',
        'fas fa-check-circle': fileStatus === 'uploaded',
        'fas fa-exclamation-triangle': fileStatus === 'error'
      }"></i>
    </span>
  </div>

  <div class="drop-area-content"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)">

    <ng-container *ngIf="!currentFile">
      <label class="drop-label">
        <i class="fas fa-cloud-upload-alt upload-icon"></i>
        <p>Arrastra tu PDF aquí o haz clic para seleccionar</p>
        <span class="placeholder-text">(Solo archivos PDF)</span>
        <input type="file" accept="application/pdf" (change)="onFileSelected($event)" style="display: none;">
      </label>
    </ng-container>

    <ng-container *ngIf="currentFile">
      <i class="fas fa-file-pdf upload-icon" style="color: #007bff;"></i>
      <p class="uploaded-file-name">
        <i class="fas fa-file-alt"></i> {{ currentFile.name }}
      </p>
    </ng-container>

    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
  </div>

  <div class="card-actions">
    <button class="btn-view" (click)="requestPreview()" [disabled]="!isPreviewEnabled()">
      <i class="fas fa-eye"></i> Previsualizar
    </button>
    <button class="btn-delete" (click)="removeFile()" [disabled]="!isRemoveEnabled()">
      <i class="fas fa-trash-alt"></i> Eliminar
    </button>
  </div>
</div>
